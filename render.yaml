services:
  - type: web
    name: perfectplate
    runtime: node
    plan: free
    branch: deploy
    buildCommand: bun install --frozen-lockfile && bunx convex deploy --cmd 'bun run build'
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BUN_VERSION
        value: "1.3.11"
      - key: CONVEX_DEPLOY_KEY
        sync: false

  # Dev site: tracks the `dev` branch and deploys to the Convex `staging`
  # deployment, so changes can be tried before they are merged into `deploy`.
  - type: web
    name: perfectplate-dev
    runtime: node
    plan: free
    branch: dev
    buildCommand: bun install --frozen-lockfile && bunx convex deploy --cmd 'bun run build'
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BUN_VERSION
        value: "1.3.11"
      - key: CONVEX_DEPLOY_KEY
        sync: false
